[package]
name = "ed"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-channel = "=2.5.0"
gpui = "=0.2.2"
libloading = "=0.8.9"
regex = "=1.13.2"
ropey = "=1.6.1"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.8.23"
tree-sitter = "=0.25.10"

[dev-dependencies]
tree-sitter-json = "=0.24.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# GPUI 0.2.2 resolves xattr 0.2.3, which references a libc alias removed
# from current releases. The vendored patch uses Linux's canonical ENODATA.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
